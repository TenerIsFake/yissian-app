// Replacement build.gradle for react-native-google-mobile-ads.
//
// The original uses io.invertase.gradle.build:1.5 which only applies com.facebook.react
// (and therefore codegen) when newArchEnabled=true. With old arch disabled, codegen
// never runs so NativeAppModuleSpec is undefined at compile time.
//
// Fix: provide NativeAppModuleSpec as a hand-written old-arch stand-in stored at
// android/generatedSrc/io/invertase/googlemobileads/NativeAppModuleSpec.java,
// and add that directory as an extra Java source set here.

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
  compileSdkVersion 34

  defaultConfig {
    minSdkVersion 23
    targetSdkVersion 34
    multiDexEnabled true
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", "false"
    buildConfigField "String", "GOOGLE_MOBILE_ADS_JSON_RAW", '"{}"'
    manifestPlaceholders = [
      appJSONGoogleMobileAdsAppID                  : "ca-app-pub-9760203099492988~3292564703",
      appJSONGoogleMobileAdsDelayAppMeasurementInit: false,
      appJSONGoogleMobileAdsOptimizeInitialization : true,
      appJSONGoogleMobileAdsOptimizeAdLoading      : true
    ]
    sourceSets {
      main {
        // oldarch contains hand-written spec stubs (NativeGoogleMobileAdsNativeModuleSpec etc.)
        // generatedSrc contains our NativeAppModuleSpec old-arch stand-in
        java.srcDirs += [
          'src/oldarch',
          new File(rootProject.projectDir, 'generatedSrc').absolutePath
        ]
      }
    }
  }

  lintOptions {
    disable 'GradleCompatible'
    abortOnError false
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation "com.google.android.gms:play-services-ads:25.0.0"
  api "com.google.android.ump:user-messaging-platform:4.0.0"
  api "com.facebook.react:react-android"
}
